version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: game
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p$MYSQL_ROOT_PASSWORD"]
      retries: 3
      timeout: 5s

  laravel:
    build:
      context: .
      dockerfile: Dockerfile.laravel
    working_dir: /var/www/html
    volumes:
      - ./my_backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=game
      - DB_USERNAME=sail
      - DB_PASSWORD=password
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      mysql:
        condition: service_healthy

  flutter-web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./flutter_app/build/web:/usr/share/nginx/html
